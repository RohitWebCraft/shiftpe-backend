function tr(t) {
  if (S.lang !== 'hi') return t;
  const k = t.trim(); if (!k) return t;
  let r = HI[k];
  if (r === undefined) for (const p of HIP) if (p[0].test(k)) { r = k.replace(p[0], p[1]); break; }
  return r === undefined ? t : t.replace(k, () => r);
}
function L(h) {
  if (document.documentElement) document.documentElement.lang = S.lang === 'hi' ? 'hi' : 'en';
  if (S.lang !== 'hi') return h;
  return h.replace(/>([^<>]+)</g, (m, t) => '>' + tr(t) + '<').replace(/(placeholder|aria-label)="([^"]+)"/g, (m, a, v) => a + '="' + tr(v) + '"');
}

async function api(path, opts = {}) {
  const h = { 'content-type': 'application/json' };
  if (S.token) h.authorization = 'Bearer ' + S.token;
  const slow = opts.quiet ? null : setTimeout(() => say('Server is waking up, this can take up to a minute…'), 4000);
  try {
    const r = await fetch(BASE + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
    let d = null; try { d = await r.json(); } catch {}
    if (!r.ok) { const e = new Error((d && d.error) || 'Request failed (' + r.status + ')'); e.status = r.status; throw e; }
    return d;
  } finally { if (slow) clearTimeout(slow); }

  + '<div class="panel"><h3>Skill unlock system</h3><p class="x">Finish 10 shifts in a skill to earn its badge. Badge holders are preferred by businesses.</p>'
  + (prog.filter((x) => x.completed > 0).map((x) => x.category).concat(prog.length ? [] : ['kirana','salon','sweets'])).map((k) => { const p = prog.find((x) => x.category === k), n = Math.min(p ? p.completed : 0, 10), on = p && p.unlocked;
      return '<div class="badge' + (on ? ' on' : '') + '"><span class="ic">' + CAT[k].e + '</span><div class="grow"><b>' + CAT[k].badge + '</b> ' + (on ? '<span class="pill">Unlocked</span>' : '') + '<div class="bar"><i style="width:' + n * 10 + '%"></i></div><span class="x">' + n + ' / 10 shifts</span></div></div>'; }).join('') + '</div>'
  + '<div class="panel"><div class="sw" style="margin:0"><div><b>Available now</b><div class="x">Get alerts for urgent shifts nearby</div></div><input type="checkbox" data-a="toggleavail" ' + (m.available_now ? 'checked' : '') + ' aria-label="Available now"></div></div>' + delBtn();
}
function postView() {
  const b = S.biz || {};
  const paid = b.plan_expires && new Date(b.plan_expires) > new Date();
  return '<div class="kick">BUSINESS</div><h1>Hire in minutes.</h1><p class="sub">' + esc(b.name || '') + ' · ⭐ ' + Number(b.rating || 4.5).toFixed(1) + ' trust</p>'
  + '<div class="panel"><div class="row"><div class="grow"><b>' + (paid ? 'Membership active' : 'Free listings left') + '</b><div class="x">' + (paid ? 'Unlimited shifts until ' + new Date(b.plan_expires).toLocaleDateString('en-IN') : 'Post your first 2 jobs for free.') + '</div></div>' + (paid ? '' : '<span class="score" style="font-size:30px;color:var(--brand)">' + esc(b.free_listings_left) + '</span>') + '</div></div>'
  + '<div class="panel"><h3>Post a shift</h3><label for="ptitle">Role</label><input id="ptitle" data-f="ptitle" placeholder="e.g. Helper for festival rush at my shop" value="' + esc(S.form.ptitle) + '">'
  + '<div class="two"><div><label for="ppay">Fixed pay for this shift (₹)</label><input id="ppay" data-f="ppay" type="number" placeholder="e.g. 300" value="' + esc(S.form.ppay) + '"></div><div><label for="phours">Hours</label><input id="phours" data-f="phours" value="' + esc(S.form.phours) + '"></div></div>'
  + '<p class="x">Workers see this as the fixed pay. You won’t have to pay more than this.</p><label for="pcat">Category</label><select id="pcat" data-f="pcat">' + Object.keys(CAT).map((k) => '<option value="' + k + '"' + (S.form.pcat === k ? ' selected' : '') + '>' + CAT[k].name + '</option>').join('') + '</select>'
  + '<label>Skills needed</label>' + chips(SKILLS, S.form.pskills, 'pskill')
  + '<label for="pdesc">Description</label><textarea id="pdesc" data-f="pdesc" rows="2">' + esc(S.form.pdesc) + '</textarea>'
  + '<div class="sw"><div><b>⚡ Urgent hiring mode</b><div class="x">Instantly notify nearby workers</div></div><input type="checkbox" data-f="purgent" ' + (S.form.purgent ? 'checked' : '') + ' aria-label="Urgent hiring"></div>'
  + '<button class="btn" style="margin-top:12px" data-a="post">' + (paid || Number(b.free_listings_left) > 0 ? 'Post shift' : 'Start hiring') + '</button></div>';
}
function jobsView() {
  let h = '<h1>My shifts</h1><p class="sub">See who is interested and accept workers.</p><div class="panel"><div class="sw" style="margin:0"><div><b>Hide workers under ' + MIN_STU + '★</b><div class="x">Late and cancelling workers are filtered out</div></div><input type="checkbox" data-a="mintrust" ' + (S.minTrust ? 'checked' : '') + ' aria-label="Reputation filter"></div></div>';
  if (!S.jobs.length) return h + '<div class="empty">Post your first shift to see interested workers here.</div>';
  return h + S.jobs.map((j) => {
    const a = S.apps[j.id], o = String(S.openJob) === String(j.id);
    let body = '';
    if (o && a) body = (a.applicants.length ? a.applicants.map((s) => '<div class="row" style="margin-top:12px"><div class="av">🧑</div><div class="grow"><b>' + esc(s.name || 'Worker') + '</b> ' + (s.has_badge ? '<span class="pill">Badge holder</span>' : '') + '<div class="x">⭐ ' + Number(s.rating).toFixed(1) + ' · ' + esc(s.ontime_pct) + '% on time · ' + esc(s.college || '') + '</div></div><button class="btn sm" data-a="accept" data-id="' + j.id + '" data-sid="' + s.id + '">Accept</button></div>').join('') : '<p class="x">No interested workers yet.</p>')
      + (a.hiddenByReputationFilter ? '<p class="x">' + a.hiddenByReputationFilter + ' worker(s) hidden by the reputation filter.</p>' : '');
    return '<div class="panel"><div class="row" data-a="openjob" data-id="' + j.id + '" style="cursor:pointer"><div class="av">' + ((CAT[j.category] || CAT.cafe).e) + '</div><div class="grow"><b>' + esc(j.title) + '</b><div class="x">' + money(j.pay) + ' · ' + esc(j.hours_text || '') + '</div></div>' + (j.urgent ? '<span class="pill r">⚡ Urgent</span>' : '') + '</div>' + body + '</div>';
  }).join('');
}

function render() {
  const keep = document.querySelector('main'), sc = keep ? keep.scrollTop : 0;
  let body, nav = '';
  if (S.screen === 'login') body = loginView();
  else if (S.screen === 'setup') body = setupView();
  else {
    const tabs = S.role === 'student' ? [['swipe','🔥','Swipe'],['matches','💬','Matches'],['me','👤','Profile']] : [['post','➕','Post'],['jobs','👥','My shifts'],['workers','🔎','Find workers'],['matches','💬','Matches'],['bizme','👤','Profile']];
    body = ({ swipe:swipeView, matches:matchesView, me:profileView, bizme:bizProfileView, workers:workersView, post:postView, jobs:jobsView })[S.tab]();
    nav = '<nav>' + tabs.map((t) => '<button data-a="tab" data-v="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '"><b>' + t[1] + (t[0] === 'matches' && (S.unread || (S.invites && S.invites.length)) ? '<sup style="color:var(--brand)">●</sup>' : '') + '</b>' + t[2] + '</button>').join('') + '</nav>';
  }
  $('app').innerHTML = L('<header><div class="logo">' + LOGO(30) + 'ShiftPe</div>' + '<span><button class="chip" data-a="lang">' + (S.lang === 'hi' ? 'English' : 'हिंदी') + '</button> ' + (S.token ? '<button class="chip" data-a="logout">Log out</button>' : '') + '</span></header><main>' + body + '</main>' + nav
    + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '')
    + (S.modal === 'match' ? '<div class="modal"><div class="sheet"><div style="font-size:48px">✨</div><h2>It’s a Shift Match!</h2><p>Your shift is confirmed. Open the chat to coordinate.</p><button class="btn" data-a="gomatches">Open chat</button><button class="btn ghost" style="margin-top:8px" data-a="closemodal">Keep swiping</button></div></div>' : '')
    + (S.modal === 'paywall' ? '<div class="modal"><div class="sheet"><div style="font-size:48px">🔒</div><h2>2 free listings used</h2><p>Membership and listing charges apply after your free listings.</p><button class="btn" data-a="devplan">Test mode: activate 30-day membership</button><button class="btn ghost" style="margin-top:8px" data-a="closemodal">Not now</button></div></div>' : '')
    + (S.modal === 'match2' ? '<div class="modal"><div class="sheet"><div style="font-size:48px">✨</div><h2>It’s a Shift Match!</h2><p>You matched. Open the chat to talk about time and place.</p><button class="btn" data-a="gomatches">Open chat</button><button class="btn ghost" style="margin-top:8px" data-a="closemodal">Keep swiping</button></div></div>' : '')
    + (S.modal === 'delete' ? '<div class="modal"><div class="sheet"><div style="font-size:48px">⚠️</div><h2>Delete your account?</h2><p>Your profile, skills and location will be removed and your open shifts will close. Your old chats will show “Deleted user”. This cannot be undone.</p><button class="btn" style="background:#c62828" data-a="confirmdelete">Yes, delete my account</button><button class="btn ghost" style="margin-top:8px" data-a="closemodal">No, keep my account</button></div></div>' : ''));
  const m = document.querySelector('main'); if (m) m.scrollTop = sc;
  bindDrag();
}

/* ---------- swipe gesture ---------- */
function fly(dir) {
  const t = $('top'); if (!t) return doSwipe(dir);
  t.style.transition = 'transform .25s,opacity .25s'; t.style.transform = 'translateX(' + (dir === 'like' ? 500 : -500) + 'px) rotate(' + (dir === 'like' ? 25 : -25) + 'deg)'; t.style.opacity = 0;
  setTimeout(() => run(() => doSwipe(dir)), 230);
}
async function doSwipe(dir) {
  if (S.role === 'business') return doWorkerSwipe(dir);
  const j = S.feed[S.fi]; if (!j) return;
  await api('/jobs/' + j.id + '/swipe', { method:'POST', body:{ direction:dir } });
  S.fi++;
  if (dir === 'like') say('Interest sent to ' + (j.business_name || 'the business') + '. You’ll match when they accept.');
}
async function doWorkerSwipe(dir) {
  const w = S.wfeed[S.wi]; if (!w) return;
  const d = await api('/workers/' + w.id + '/swipe', { method:'POST', body:{ jobId:S.wjob, direction:dir } });
  S.wi++;
  if (dir === 'like') { if (d.matched) { S.lastMatch = d.matchId; S.modal = 'match2'; } else say('Invite sent to ' + (w.name || 'the worker') + '. You’ll match when they accept.'); }
}
function bindDrag() {
  const t = $('top'); if (!t) return; let x0 = null, dx = 0;
  t.onpointerdown = (e) => { x0 = e.clientX; t.setPointerCapture(e.pointerId); t.style.transition = 'none'; };
  t.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; t.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 20 + 'deg)'; $('sl').style.opacity = Math.max(0, dx / 100); $('sp').style.opacity = Math.max(0, -dx / 100); };
  t.onpointerup = () => { if (x0 === null) return; x0 = null; if (dx > 90) fly('like'); else if (dx < -90) fly('pass'); else { t.style.transition = 'transform .2s'; t.style.transform = ''; $('sl').style.opacity = 0; $('sp').style.opacity = 0; } dx = 0; };
}

/* ---------- inputs and clicks ---------- */
function onField(e) {
  const f = e.target.dataset.f; if (!f) return;
  S.form[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (f === 'town') { const t = TOWNS.find((x) => x.k === e.target.value); if (t) { S.form.lat = t.lat; S.form.lng = t.lng; } }
  if (f === 'wjob' && e.type === 'change') { S.wjob = e.target.value; run(async () => { await loadWorkers(); }); }
  if (f === 'wradius' && e.type === 'change') { S.wradius = Number(e.target.value); run(async () => { await loadWorkers(); }); }
  if (f === 'radius' && e.type === 'change') { S.radius = Number(e.target.value); run(async () => { await loadFeed(); }); }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat(v));
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id;
  const sync = () => { S.form.name = S.form.name; };
  run(async () => {
    if (a === 'setrole') { S.roleSel = v; S.form.phone = v === 'student' ? '9000000001' : '9000000002'; S.otpSent = false; }
    else if (a === 'sendotp') {
      const d = await api('/auth/request-otp', { method:'POST', body:{ phone:S.form.phone.trim(), role:S.roleSel, pilotCode:S.form.pilot.trim() } });
      store.set('shiftpe_pilot', S.form.pilot.trim()); S.otpSent = true; if (d.devOtp) S.form.otp = d.devOtp;
    }
    else if (a === 'verify') {
      const d = await api('/auth/verify-otp', { method:'POST', body:{ phone:S.form.phone.trim(), otp:S.form.otp.trim(), role:S.roleSel } });
      S.token = d.token; S.role = d.user.role; store.set('shiftpe', { token:S.token, role:S.role });
      if (S.role !== S.roleSel) say('This number is already registered as a ' + S.role + '.');
      await bootstrap();
    }
    else if (a === 'lang') { S.lang = S.lang === 'hi' ? 'en' : 'hi'; store.set('shiftpe_lang', S.lang); }
    else if (a === 'editprofile') {
      if (S.role === 'student') { const m = S.me || {}; Object.assign(S.form, { name:m.name || '', age:m.age || '', college:m.college || '', skills:m.skills || [], avail:!!m.available_now }); }
      else S.form.name = (S.biz && S.biz.name) || '';
      S.form.town = 'keep'; S.editing = true; S.screen = 'setup';
    }
    else if (a === 'canceledit') { endEdit(); S.screen = 'app'; }
    else if (a === 'refreshworkers') await loadWorkers();
    else if (a === 'acceptinvite') { const d = await api('/invites/' + id + '/accept', { method:'POST' }); await loadMatches(); if (d.matchId) await openMatch(d.matchId); say('Matched! Chat is open. Talk about time and place.'); }
    else if (a === 'declineinvite') { await api('/invites/' + id + '/decline', { method:'POST' }); await loadMatches(); }
    else if (a === 'askdelete') S.modal = 'delete';
    else if (a === 'confirmdelete') { await api('/account', { method:'DELETE' }); logout(); say('Your account has been deleted.'); }
    else if (a === 'logout') logout();
    else if (a === 'skill') S.form.skills = toggle(S.form.skills, v);
    else if (a === 'pskill') S.form.pskills = toggle(S.form.pskills, v);
    else if (a === 'geo') {
      if (!navigator.geolocation) throw new Error('Location is not supported on this device');
      await new Promise((ok, no) => navigator.geolocation.getCurrentPosition((p) => { S.form.lat = p.coords.latitude; S.form.lng = p.coords.longitude; S.form.town = 'gps'; ok(); }, () => no(new Error('Location blocked. Allow it in the browser or choose your town.'))));
    }
    else if (a === 'savestudent') {
      const f = S.form, age = Number(f.age);
      if (!f.name.trim()) throw new Error('Enter your name');
      if (!(age >= 18)) throw new Error('You must be 18 or above');
      await api('/students/me', { method:'PUT', body:{ name:f.name.trim(), age, college:f.college.trim(), skills:f.skills, lat:(S.editing && f.town === 'keep') ? undefined : f.lat, lng:(S.editing && f.town === 'keep') ? undefined : f.lng, availableNow:!!f.avail } });
      saveLocName(); S.me = await api('/students/me'); S.screen = 'app';
      if (S.editing) { endEdit(); S.tab = 'me'; say('Profile saved ✅'); } else { S.tab = 'swipe'; await loadFeed(); }
    }
    else if (a === 'savebiz') {
      if (!S.form.name.trim()) throw new Error('Enter your business name');
      const keep = S.editing && S.form.town === 'keep';
      await api('/businesses/me', { method:'PUT', body:{ name:S.form.name.trim(), lat:keep ? undefined : S.form.lat, lng:keep ? undefined : S.form.lng } });
      saveLocName(); S.biz = await api('/businesses/me'); S.screen = 'app';
      if (S.editing) { endEdit(); S.tab = 'bizme'; say('Profile saved ✅'); } else S.tab = 'post';
    }
    else if (a === 'tab') await enter(v);
    else if (a === 'like' || a === 'pass') return fly(a);
    else if (a === 'save') await doSwipe('save');
    else if (a === 'refresh') await loadFeed();
    else if (a === 'claim') { const j = S.feed[S.fi]; await api('/jobs/' + j.id + '/claim', { method:'POST' }); S.fi++; S.modal = 'match'; }
    else if (a === 'closemodal') S.modal = null;
    else if (a === 'gomatches') { S.modal = null; await enter('matches'); if (S.matches.length) await openMatch(S.matches[0].id); }
    else if (a === 'open') await openMatch(id);
    else if (a === 'quick') {
      const body = (QUICK[S.lang === 'hi' ? 'hi' : 'en'][S.role] || [])[Number(v)]; if (!body) return;
      await api('/matches/' + S.open + '/messages', { method:'POST', body:{ body } }); S.msgs = await api('/matches/' + S.open + '/messages');
    }
    else if (a === 'send') {
      const body = S.form.msg.trim(); if (!body) return;
      await api('/matches/' + S.open + '/messages', { method:'POST', body:{ body } });
      S.form.msg = ''; S.msgs = await api('/matches/' + S.open + '/messages');
    }
    else if (a === 'confirm') { await api('/matches/' + S.open + '/confirm', { method:'POST' }); await loadMatches(); say('Shift confirmed ✅'); }
    else if (a === 'complete') {
      const d = await api('/matches/' + S.open + '/complete', { method:'POST', body:{ lateMinutes:Number(S.form.late) || 0 } });
      await loadMatches(); say(d.badgeUnlocked ? '🏅 Badge unlocked for the worker: ' + d.badgeUnlocked : 'Shift completed. Scores updated.');
    }
    else if (a === 'cancel') {
      const d = await api('/matches/' + S.open + '/cancel', { method:'POST' });
      await loadMatches(); say(d.reputationPenalty ? 'Shift cancelled. Your trust score was reduced.' : 'You backed out of this match.');
    }
    else if (a === 'rate') { await api('/matches/' + S.open + '/rate', { method:'POST', body:{ stars:Number(v) } }); say('Thanks for rating!'); }
    else if (a === 'toggleavail') { S.me = Object.assign(S.me, { available_now:el.checked }); await api('/students/me', { method:'PUT', body:{ skills:S.me.skills || [], availableNow:el.checked } }); say(el.checked ? 'You’ll get urgent shift alerts' : 'Urgent alerts off'); }
    else if (a === 'post') {
      const f = S.form;
      if (!f.ptitle.trim()) throw new Error('Add a role name first');
      try {
        const d = await api('/jobs', { method:'POST', body:{ title:f.ptitle.trim(), category:f.pcat, pay:Number(f.ppay) || 0, hoursText:f.phours, skills:f.pskills, description:f.pdesc, urgent:!!f.purgent } });
        const key = 'shiftpe_jobs_' + S.uid, list = (store.get(key) || []); list.unshift({ id:d.job.id, title:d.job.title, category:f.pcat, pay:d.job.pay, hours_text:f.phours, urgent:d.job.urgent }); store.set(key, list);
        Object.assign(S.form, { ptitle:'', pdesc:'', pskills:[], purgent:false });
        await enter('jobs'); say(d.job.urgent ? '⚡ Urgent alert sent to ' + d.notifiedStudents + ' nearby worker(s)' : 'Shift posted');
      } catch (err) {
        if (err.status === 402) { S.modal = 'paywall'; S.biz = await api('/businesses/me'); }
        else if (/location/i.test(err.message)) { S.screen = 'setup'; throw err; }
        else throw err;
      }
    }
    else if (a === 'devplan') { await api('/billing/dev-activate', { method:'POST' }); S.modal = null; S.biz = await api('/businesses/me'); say('Membership active for 30 days (test mode)'); }
    else if (a === 'openjob') { const n = String(id); if (String(S.openJob) === n) S.openJob = null; else { S.openJob = n; await loadApplicants(n); } }
    else if (a === 'mintrust') { S.minTrust = el.checked; if (S.openJob) await loadApplicants(S.openJob); }
    else if (a === 'accept') { const d = await api('/jobs/' + id + '/accept/' + el.dataset.sid, { method:'POST' }); await loadApplicants(id); await enter('matches'); await openMatch(d.matchId); say('Matched! You can chat now.'); }
  });
});

/* ---------- start ---------- */
setInterval(async () => {
  if (!S.token || S.screen !== 'app') return;
  try {
    const m = await api('/matches', { quiet:true }); let inv = []; if (S.role === 'student') { try { inv = await api('/invites', { quiet:true }); } catch {} } S.invites = inv; const g = sigOf(m) + invSig();
    if (msig === null) { msig = g; return; }
    if (g !== msig) {
      msig = g; S.matches = m;
      if (S.tab !== 'matches') { S.unread = true; say('🔔 You have a new match update. Open the Matches tab.'); }
      else if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render();
    }
  } catch {}
}, 20000);
(function init() {
  const s = store.get('shiftpe');
  render();
  if (s && s.token) { S.token = s.token; S.role = s.role; S.roleSel = s.role; run(async () => { await bootstrap(); }); }
})();
</script>
</body>
</html>
